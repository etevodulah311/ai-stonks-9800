<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI STONKS-9800</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }
        
        /* Old CRT Monitor Case */
        .crt-monitor {
            position: relative;
            background: linear-gradient(180deg, #d4d0c8 0%, #b8b4a8 20%, #a8a498 50%, #989488 100%);
            border-radius: 25px 25px 20px 20px;
            padding: 35px 40px 50px 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 100px rgba(0, 180, 180, 0.1),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        }
        
        /* Monitor brand label */
        .crt-monitor::before {
            content: 'NEC PC-9800';
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #505050;
            letter-spacing: 2px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.3);
        }
        
        /* Power LED */
        .crt-monitor::after {
            content: '';
            position: absolute;
            bottom: 18px;
            right: 50px;
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 
                0 0 10px #00ff00,
                0 0 20px #00ff00,
                inset 0 -2px 4px rgba(0,0,0,0.3);
            animation: led-pulse 2s ease-in-out infinite;
        }
        
        @keyframes led-pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00; }
            50% { opacity: 0.8; box-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00; }
        }
        
        /* Inner bezel */
        .screen-bezel {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #0a0a0a 100%);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 
                inset 0 3px 10px rgba(0, 0, 0, 0.8),
                inset 0 -1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .screen-container {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
            border-radius: 20px / 15px;
            background: #000;
            box-shadow: 
                inset 0 0 100px rgba(0, 50, 50, 0.5),
                inset 0 0 50px rgba(0, 0, 0, 1);
        }
        
        #gameCanvas {
            width: 800px;
            height: 600px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: brightness(1.1) contrast(1.1) saturate(1.2);
        }
        
        /* Screen curvature effect */
        .screen-curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse 120% 120% at 50% 50%,
                transparent 0%,
                transparent 70%,
                rgba(0, 0, 0, 0.3) 100%
            );
            pointer-events: none;
            z-index: 15;
            border-radius: 20px / 15px;
        }
        
        /* CRT Scanlines - more pronounced */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }
        
        /* Horizontal scan effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 255, 200, 0.03) 50%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 13;
            animation: scan 8s linear infinite;
        }
        
        @keyframes scan {
            0% { top: -10px; }
            100% { top: 100%; }
        }
        
        /* CRT Flicker */
        .crt-flicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 16, 16, 0.1);
            pointer-events: none;
            z-index: 11;
            animation: flicker 0.1s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 0.02; }
            25% { opacity: 0.04; }
            50% { opacity: 0.02; }
            75% { opacity: 0.05; }
        }
        
        /* Phosphor glow */
        .phosphor-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 80, 80, 0.1) 0%,
                transparent 70%
            );
            pointer-events: none;
            z-index: 8;
            mix-blend-mode: screen;
        }
        
        /* Vignette - stronger */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse 80% 80% at center,
                transparent 40%,
                rgba(0, 0, 0, 0.6) 100%
            );
            pointer-events: none;
            z-index: 12;
        }
        
        /* RGB Shift / Chromatic aberration */
        .rgb-shift {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            box-shadow: 
                inset 3px 0 8px rgba(255, 0, 0, 0.1),
                inset -3px 0 8px rgba(0, 0, 255, 0.1),
                inset 0 3px 8px rgba(0, 0, 0, 0.2),
                inset 0 -3px 8px rgba(0, 0, 0, 0.2);
        }
        
        /* Screen reflection */
        .screen-reflection {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 30%;
            height: 20%;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.08) 0%,
                transparent 50%
            );
            pointer-events: none;
            z-index: 14;
            border-radius: 50%;
            filter: blur(10px);
        }
        
        /* Vertical side text */
        .side-text {
            position: absolute;
            font-family: 'VT323', monospace;
            font-size: 80px;
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 10px;
            user-select: none;
            -webkit-text-stroke: 2px rgba(0, 0, 0, 0.8);
            paint-order: stroke fill;
            text-shadow: 
                0 0 2px currentColor,
                0 0 4px currentColor,
                4px 0 0 rgba(255, 0, 0, 0.7),
                -4px 0 0 rgba(0, 0, 255, 0.7),
                0 0 30px rgba(0, 200, 200, 0.6),
                0 0 60px rgba(0, 200, 200, 0.3);
        }
        
        .side-text-left {
            left: -100px;
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
            color: #00ffff;
            white-space: nowrap;
        }
        
        .side-text-right {
            right: -75px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff5050;
        }
        
        /* Container for positioning */
        .game-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Monitor stand hint */
        .monitor-stand {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: linear-gradient(180deg, #a8a498 0%, #888880 100%);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="side-text side-text-left">AI STONKS</div>
        <div class="crt-monitor">
            <div class="screen-bezel">
                <div class="screen-container">
                    <canvas id="gameCanvas" width="400" height="300"></canvas>
                    <div class="phosphor-glow"></div>
                    <div class="scanlines"></div>
                    <div class="scan-line"></div>
                    <div class="crt-flicker"></div>
                    <div class="vignette"></div>
                    <div class="rgb-shift"></div>
                    <div class="screen-reflection"></div>
                    <div class="screen-curve"></div>
                </div>
            </div>
            <div class="monitor-stand"></div>
        </div>
        <div class="side-text side-text-right">9800</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
