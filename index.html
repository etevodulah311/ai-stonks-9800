<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI STONKS-9800</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }
        
        /* Old CRT Monitor Case - Aged & Yellowed */
        .crt-monitor {
            position: relative;
            background: linear-gradient(180deg, #c9c4a8 0%, #b5ac8a 20%, #a89c78 50%, #968a68 100%);
            border-radius: 25px 25px 20px 20px;
            padding: 35px 40px 50px 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 100px rgba(0, 180, 180, 0.1),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                inset 0 -2px 0 rgba(0, 0, 0, 0.3),
                inset 0 0 30px rgba(139, 119, 42, 0.15);
        }
        
        /* Scratches and scuffs overlay */
        .monitor-scratches {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 25px 25px 20px 20px;
            pointer-events: none;
            background-image: 
                /* Deep scratches */
                linear-gradient(45deg, transparent 48%, rgba(0,0,0,0.08) 49%, transparent 51%),
                linear-gradient(-30deg, transparent 47%, rgba(0,0,0,0.05) 48%, transparent 50%),
                linear-gradient(70deg, transparent 46%, rgba(255,255,255,0.05) 47%, transparent 49%),
                linear-gradient(-60deg, transparent 49%, rgba(0,0,0,0.06) 50%, transparent 52%),
                /* Surface texture - aged plastic */
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    rgba(0,0,0,0.01) 1px,
                    transparent 2px,
                    transparent 4px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    rgba(0,0,0,0.01) 1px,
                    transparent 2px,
                    transparent 4px
                );
            background-size: 
                400px 400px, 300px 300px, 250px 250px, 350px 350px,
                4px 4px, 4px 4px;
            background-position: 
                10px 20px, 50px 10px, 80px 40px, 20px 60px,
                0 0, 0 0;
            z-index: 50;
        }
        
        /* Dust and grime spots */
        .monitor-dust {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 25px 25px 20px 20px;
            pointer-events: none;
            background-image:
                radial-gradient(ellipse 3px 2px at 15% 20%, rgba(80,70,40,0.15) 0%, transparent 100%),
                radial-gradient(ellipse 4px 3px at 85% 15%, rgba(60,50,30,0.12) 0%, transparent 100%),
                radial-gradient(ellipse 2px 2px at 45% 88%, rgba(70,60,35,0.18) 0%, transparent 100%),
                radial-gradient(ellipse 5px 4px at 92% 75%, rgba(90,80,50,0.1) 0%, transparent 100%),
                radial-gradient(ellipse 3px 3px at 8% 65%, rgba(75,65,40,0.14) 0%, transparent 100%),
                radial-gradient(ellipse 2px 3px at 35% 12%, rgba(85,75,45,0.11) 0%, transparent 100%),
                radial-gradient(ellipse 4px 2px at 70% 92%, rgba(65,55,35,0.16) 0%, transparent 100%),
                /* Larger discoloration patches */
                radial-gradient(ellipse 80px 60px at 20% 30%, rgba(139,119,42,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 100px 70px at 80% 70%, rgba(150,130,50,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 60px 80px at 50% 85%, rgba(130,110,40,0.07) 0%, transparent 70%);
            z-index: 51;
        }
        
        /* Worn edges effect */
        .monitor-wear {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 25px 25px 20px 20px;
            pointer-events: none;
            box-shadow:
                /* Worn corners - lighter from use */
                inset 25px 25px 30px -20px rgba(255,255,255,0.08),
                inset -25px 25px 30px -20px rgba(255,255,255,0.06),
                inset 25px -25px 30px -20px rgba(255,255,255,0.05),
                inset -25px -25px 30px -20px rgba(255,255,255,0.07),
                /* Edge darkening from handling */
                inset 0 5px 15px -5px rgba(0,0,0,0.15),
                inset 5px 0 15px -5px rgba(0,0,0,0.1),
                inset -5px 0 15px -5px rgba(0,0,0,0.1),
                inset 0 -5px 15px -5px rgba(0,0,0,0.2);
            z-index: 52;
        }
        
        /* Old sticker residue */
        .sticker-residue {
            position: absolute;
            top: 12px;
            right: 60px;
            width: 50px;
            height: 20px;
            background: rgba(180, 170, 140, 0.4);
            border-radius: 3px;
            transform: rotate(-3deg);
            box-shadow: 
                inset 0 0 5px rgba(0,0,0,0.1),
                0 1px 2px rgba(0,0,0,0.1);
            z-index: 53;
        }
        
        .sticker-residue::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 5px;
            width: 30px;
            height: 3px;
            background: rgba(100, 90, 60, 0.3);
            border-radius: 1px;
        }
        
        /* Power LED - slightly dimmer from age */
        .power-led {
            position: absolute;
            bottom: 18px;
            right: 50px;
            width: 10px;
            height: 10px;
            background: #00dd00;
            border-radius: 50%;
            box-shadow: 
                0 0 8px #00cc00,
                0 0 15px rgba(0,200,0,0.5),
                inset 0 -2px 4px rgba(0,0,0,0.4);
            animation: led-pulse 2s ease-in-out infinite;
        }
        
        @keyframes led-pulse {
            0%, 100% { opacity: 0.9; box-shadow: 0 0 8px #00cc00, 0 0 15px rgba(0,200,0,0.5); }
            50% { opacity: 0.6; box-shadow: 0 0 4px #00aa00, 0 0 8px rgba(0,180,0,0.3); }
        }
        
        /* LED housing - dirty */
        .power-led::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(80,70,50,0.3);
            z-index: -1;
        }
        
        /* Inner bezel */
        .screen-bezel {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #0a0a0a 100%);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 
                inset 0 3px 10px rgba(0, 0, 0, 0.8),
                inset 0 -1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .screen-container {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
            border-radius: 20px / 15px;
            background: #000;
            box-shadow: 
                inset 0 0 100px rgba(0, 50, 50, 0.5),
                inset 0 0 50px rgba(0, 0, 0, 1);
        }
        
        #gameCanvas {
            width: 800px;
            height: 600px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: brightness(1.1) contrast(1.1) saturate(1.2);
        }
        
        /* Screen curvature effect */
        .screen-curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse 120% 120% at 50% 50%,
                transparent 0%,
                transparent 70%,
                rgba(0, 0, 0, 0.3) 100%
            );
            pointer-events: none;
            z-index: 15;
            border-radius: 20px / 15px;
        }
        
        /* CRT Scanlines - more pronounced */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }
        
        /* Horizontal scan effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 255, 200, 0.03) 50%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 13;
            animation: scan 8s linear infinite;
        }
        
        @keyframes scan {
            0% { top: -10px; }
            100% { top: 100%; }
        }
        
        /* CRT Flicker */
        .crt-flicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 16, 16, 0.1);
            pointer-events: none;
            z-index: 11;
            animation: flicker 0.1s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 0.02; }
            25% { opacity: 0.04; }
            50% { opacity: 0.02; }
            75% { opacity: 0.05; }
        }
        
        /* Phosphor glow */
        .phosphor-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 80, 80, 0.1) 0%,
                transparent 70%
            );
            pointer-events: none;
            z-index: 8;
            mix-blend-mode: screen;
        }
        
        /* Vignette - stronger */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse 80% 80% at center,
                transparent 40%,
                rgba(0, 0, 0, 0.6) 100%
            );
            pointer-events: none;
            z-index: 12;
        }
        
        /* RGB Shift / Chromatic aberration */
        .rgb-shift {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            box-shadow: 
                inset 3px 0 8px rgba(255, 0, 0, 0.1),
                inset -3px 0 8px rgba(0, 0, 255, 0.1),
                inset 0 3px 8px rgba(0, 0, 0, 0.2),
                inset 0 -3px 8px rgba(0, 0, 0, 0.2);
        }
        
        /* Screen reflection */
        .screen-reflection {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 30%;
            height: 20%;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.08) 0%,
                transparent 50%
            );
            pointer-events: none;
            z-index: 14;
            border-radius: 50%;
            filter: blur(10px);
        }
        
        /* Vertical side text */
        .side-text {
            position: absolute;
            font-family: 'VT323', monospace;
            font-size: 80px;
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 10px;
            user-select: none;
            -webkit-text-stroke: 2px rgba(0, 0, 0, 0.8);
            paint-order: stroke fill;
            text-shadow: 
                0 0 2px currentColor,
                0 0 4px currentColor,
                4px 0 0 rgba(255, 0, 0, 0.7),
                -4px 0 0 rgba(0, 0, 255, 0.7),
                0 0 30px rgba(0, 200, 200, 0.6),
                0 0 60px rgba(0, 200, 200, 0.3);
        }
        
        .side-text-left {
            left: -100px;
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
            color: #00ffff;
            white-space: nowrap;
        }
        
        .side-text-right {
            right: -75px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff5050;
        }
        
        /* Container for positioning */
        .game-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Monitor stand - aged */
        .monitor-stand {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: linear-gradient(180deg, #a89c78 0%, #887860 100%);
            border-radius: 0 0 10px 10px;
            box-shadow: 
                0 5px 15px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(255,255,255,0.1),
                inset 0 -2px 4px rgba(0,0,0,0.2);
        }
        
        /* Stand scratches */
        .monitor-stand::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 0 0 10px 10px;
            background: 
                linear-gradient(80deg, transparent 45%, rgba(255,255,255,0.05) 46%, transparent 48%),
                linear-gradient(-70deg, transparent 50%, rgba(0,0,0,0.08) 51%, transparent 53%);
        }
        
        /* Ventilation slots - aged */
        .monitor-vents {
            position: absolute;
            top: 8px;
            right: 15px;
            display: flex;
            gap: 4px;
        }
        
        .monitor-vents span {
            width: 30px;
            height: 3px;
            background: linear-gradient(180deg, #706050 0%, #504030 100%);
            border-radius: 1px;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
        }
        
        /* Monitor brand label - faded */
        .brand-label {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #605848;
            letter-spacing: 2px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.15);
            opacity: 0.7;
        }
        
        /* Power button - worn */
        .power-button {
            position: absolute;
            bottom: 15px;
            right: 80px;
            width: 25px;
            height: 25px;
            background: linear-gradient(180deg, #504840 0%, #383028 100%);
            border-radius: 4px;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.1),
                inset 0 -1px 2px rgba(0,0,0,0.3),
                0 2px 4px rgba(0,0,0,0.3);
        }
        
        .power-button::after {
            content: '⏻';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #888;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="side-text side-text-left">AI STONKS</div>
        <div class="crt-monitor">
            <!-- Aging effects overlays -->
            <div class="monitor-scratches"></div>
            <div class="monitor-dust"></div>
            <div class="monitor-wear"></div>
            <div class="sticker-residue"></div>
            
            <!-- Ventilation slots -->
            <div class="monitor-vents">
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <div class="screen-bezel">
                <div class="screen-container">
                    <canvas id="gameCanvas" width="400" height="300"></canvas>
                    <div class="phosphor-glow"></div>
                    <div class="scanlines"></div>
                    <div class="scan-line"></div>
                    <div class="crt-flicker"></div>
                    <div class="vignette"></div>
                    <div class="rgb-shift"></div>
                    <div class="screen-reflection"></div>
                    <div class="screen-curve"></div>
                </div>
            </div>
            
            <!-- Bottom panel elements -->
            <div class="power-led"></div>
            <div class="power-button"></div>
            <div class="brand-label">NEC PC-9800</div>
            <div class="monitor-stand"></div>
        </div>
        <div class="side-text side-text-right">9800</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
